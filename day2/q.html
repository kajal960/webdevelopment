<!DOCTYPE html>
<html lang="en">
<head>
    <title>Moon Travel</title>
</head>

<body bgcolor="lightblue">

    <h1 align="center">MOON TRAVEL REGISTRATION</h1>

    <hr>

    <form>
        <table align="center" cellpadding="8">

            <tr>
                <td>Name</td>
                <td><input type="text" name="name"></td>
            </tr>

            <tr>
                <td>Roll No</td>
                <td><input type="text" name="roll_no"></td>
            </tr>

            <tr>
                <td>DOB</td>
                <td><input type="date" name="dob"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>State</td>
                <td>
                    <select name="state">
                        <option>Select State</option>
                        <option>Bihar</option>
                        <option>Madhya Pradesh</option>
                        <option>Delhi</option>
                        <option>Uttar Pradesh</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Purpose of Visit</td>
                <td>
                    <input type="radio" name="purpose"> Travel
                    <input type="radio" name="purpose"> Research
                </td>
            </tr>

            <tr>
                <td>Favourite Activity</td>
                <td>
                    <input type="checkbox"> Photography
                    <input type="checkbox"> Exploring
                </td>
            </tr>

            <tr>
                <td>Upload Photo</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>Why do you want to visit Moon?</td>
                <td>
                    <textarea rows="3" cols="25"></textarea>
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Submit">
                </td>
                <td>
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

    <hr>

    <p align="center">
        Welcome to Moon Travel 2026 🌕
    </p>

</body>
</html>
