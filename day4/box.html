<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
    <style>
        #boy {
            width: 100%;
            height: 400px;
            background-color: lightblue;
        }
        #boy .box1 {
            width: 50%;
            height: 400px;
            background-color: rgb(234, 95, 9) ;
            margin: auto;
            float: left;
        }
        #boy .box2 {
            width: 50%;
            height: 400px;
            background-color: rgb(136, 16, 138) ;
            margin: auto;
            float: right;
        
        }
        .box2 .c1 .top {
            width: 100%;
            height: 200px;
            background-color: red ;
            margin: auto;
            
        }
        .box2 .c2 .left {
            width: 50%;
            height: 200px;
            background-color: blue ;
            margin: auto;
            float: left;
        }
        .box2 .c3 .right {
            width: 50%;
            height: 200px;
            background-color: green ;
            margin: auto;
            float: right;
        }
    </style>
</head>
<body>
    <div id="boy">
        <div class="box1"></div>
        <div class="box2"> 
            <div class="c1">
                <div class="top"></div>
            </div>
            <div class="c2">
                <div class="left"></div>
            </div>
            <div class="c3">
                <div class="right"></div>
            </div>
        </div>
    </div>
</body>
